[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-summarizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.198.0",
    "google-genai>=2.11.0",
    "markdown>=3.10.3",
    "openai>=1.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "streamlit>=1.60.0",
    "supabase>=2.31.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
youtube-summarizer = "youtube_summarizer.cli:main"
